<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Triz Eustáquio</title>
<meta name="description" content="Triz Eustáquio, estrategista de marketing e posicionamento. Mentoria Relevo, análise de perfil, publicidade e palestras.">
<meta name="theme-color" content="#E7D7CA">
<meta property="og:title" content="Triz Eustáquio">
<meta property="og:description" content="Estrategista de marketing e posicionamento">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700&display=swap">
<style>
  /* Layout: coluna única de banners com foto (proporção 897:282) sobre fundo rosado,
     redes sociais em círculos e rodapé vinho. Tudo escala pela largura do banner (--cw). */
  :root {
    /* paleta da Triz */
    --blush: #E7D7CA;   /* fundo da página, texto sobre vinho */
    --areia: #E5E2B9;   /* texto sobre os banners, fio da borda */
    --oliva: #91963A;   /* palavra em destaque nos banners verdes */
    --musgo: #48491D;   /* banners e círculos das redes */
    --vinho: #5B0D23;   /* banner de destaque e rodapé */
    /* tons mais fundos de musgo e vinho, só para dar profundidade aos banners */
    --musgo-fundo: 43, 44, 17;
    --musgo-brilho: 72, 73, 29;
    --vinho-fundo: 62, 8, 24;
    --vinho-brilho: 91, 13, 35;
    --grotesca: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --cw: min(100vw - 32px, 618px); /* largura real de um banner */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--blush);
    color: var(--musgo);
    font-family: var(--grotesca);
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 650px;
    padding-top: 48px;
    padding-bottom: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- banners ---------- */
  .cards { display: flex; flex-direction: column; }
  .card + .card { margin-top: 16px; }

  .card {
    --fundo: var(--musgo-fundo);
    --brilho: var(--musgo-brilho);
    --texto: var(--areia);
    --destaque: var(--oliva);
    --s: 52%; /* onde a foto começa, da esquerda para a direita */

    position: relative;
    display: block;
    width: 100%;
    height: calc(var(--cw) * .3144);
    border-radius: 22px;
    overflow: hidden;
    isolation: isolate;
    background: rgb(var(--fundo));
    color: var(--texto);
    text-decoration: none;
    transition: transform .3s;
    animation: entra 1.1s cubic-bezier(.2, .7, .2, 1) backwards;
  }
  .card--vinho {
    --fundo: var(--vinho-fundo);
    --brilho: var(--vinho-brilho);
    --texto: var(--blush);
    --destaque: var(--areia);
  }
  .card--larga { --s: 34%; }
  .card--perto { --s: 54%; }

  .card:nth-child(2) { animation-delay: .08s; }
  .card:nth-child(3) { animation-delay: .16s; }
  .card:nth-child(4) { animation-delay: .24s; }
  .card:nth-child(5) { animation-delay: .32s; }
  .card:nth-child(6) { animation-delay: .40s; }
  .card:hover, .card:active { transform: rotate(3deg); }
  .card:focus-visible { transform: rotate(3deg); outline: 3px solid var(--vinho); outline-offset: 3px; }

  @keyframes entra {
    from { opacity: 0; transform: translate3d(40%, 0, 0); }
    to   { opacity: 1; transform: none; }
  }

  /* foto ocupa o lado direito; o degradê na cor do banner cobre o lado do texto */
  .card__photo {
    position: absolute;
    top: 0; right: 0;
    width: calc(100% - var(--s)); height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  .card__shade {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: -1;
    background:
      radial-gradient(85% 160% at 0% 115%, rgba(var(--brilho), .9) 0%, rgba(var(--brilho), 0) 62%),
      linear-gradient(90deg,
        rgb(var(--fundo)) 0%,
        rgb(var(--fundo)) calc(var(--s) - 1%),
        rgba(var(--fundo), .86) calc(var(--s) + 8%),
        rgba(var(--fundo), .38) calc(var(--s) + 21%),
        rgba(var(--fundo), 0) calc(var(--s) + 36%)),
      linear-gradient(0deg, rgba(var(--fundo), .4) 0%, rgba(var(--fundo), 0) 45%);
  }
  /* fio claro em volta do banner */
  .card::after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1.5px rgba(229, 226, 185, .42);
    pointer-events: none;
  }

  .card__text {
    position: absolute;
    top: 0; bottom: 0; left: 7%;
    max-width: 56%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
  }
  .card__title {
    font-size: calc(var(--cw) * .07);
    font-weight: 400;
    line-height: 1.02;
    letter-spacing: -.022em;
  }
  .card__title strong, .card__title span { display: block; }
  .card__title strong { font-weight: 700; color: var(--destaque); }
  .card__title--caps {
    font-size: calc(var(--cw) * .061);
    line-height: 1.08;
    letter-spacing: -.012em;
    text-transform: uppercase;
  }
  .card__cta {
    margin-top: calc(var(--cw) * .026);
    display: flex;
    align-items: center;
    font-size: calc(var(--cw) * .034);
    line-height: 1;
    letter-spacing: -.005em;
  }
  .card__cta svg {
    width: .82em; height: .82em;
    margin-left: .45em;
    fill: none;
    stroke: var(--destaque);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* banner do TikTok: duas fotos pequenas inclinadas, como telas de celular */
  .card__mini {
    position: absolute;
    top: 13%;
    width: 15.6%; height: 74%;
    object-fit: cover;
    border-radius: calc(var(--cw) * .014);
    box-shadow: 0 0 0 1px rgba(229, 226, 185, .7), 0 calc(var(--cw) * .012) calc(var(--cw) * .035) rgba(0, 0, 0, .45);
  }
  .card__mini--a { right: 22%; transform: rotate(-5deg); }
  .card__mini--b { right: 5%; top: 15%; transform: rotate(4deg); }

  /* ---------- redes ---------- */
  .social { display: flex; justify-content: center; margin-top: 36px; }
  .social a {
    width: 44px; height: 44px;
    margin: 0 4px;
    border-radius: 50%;
    background: var(--musgo);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s, background .25s;
  }
  .social a:hover { transform: translateY(-3px); background: var(--vinho); }
  .social a:focus-visible { outline: 3px solid var(--vinho); outline-offset: 3px; }
  .social svg { width: 19px; height: 19px; fill: var(--areia); }

  footer {
    margin-top: auto;
    width: 100%;
    padding: 20px 16px;
    font-size: 12px;
    text-align: center;
    background: var(--vinho);
    color: var(--blush);
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; transition: none; }
    .card:hover, .card:active, .card:focus-visible { transform: none; }
    .social a { transition: none; }
  }
</style>
